# OpenPrintHQ edge router — single entrypoint for the app CT.
# npmplus proxies internal.example.com -> this router on :80.
# /api/* -> control-plane ; everything else -> web (SvelteKit).
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Uses the Docker embedded DNS resolver + variable proxy_pass so upstream IPs
# are re-resolved at request time — a control-plane/web container recreate (new
# IP) no longer strands nginx on a stale IP (which caused 502s).

# "" -> "" keeps ordinary requests on keep-alive; a websocket request gets
# "upgrade". Hardcoding either value breaks the other, which is how the
# connector's multiplexed tunnel ended up silently falling back to the slow
# transport: the upgrade never reached the control-plane.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The connector tunnel: a websocket (/api/connector/ws) or a long-lived SSE
    # stream (/api/connector/stream), both of which must not be buffered and
    # must not be idled out. Declared before /api/ so it wins.
    location /api/connector/ {
        set $ophq_control_conn http://control-plane:8080;
        proxy_pass $ophq_control_conn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $ophq_control http://control-plane:8080;
        proxy_pass $ophq_control;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $ophq_web http://web:3000;
        proxy_pass $ophq_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

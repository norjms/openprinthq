# OpenPrintHQ edge router — single entrypoint for the app CT.
# npmplus proxies internal.example.com -> this router on :80.
# /api/* -> control-plane ; everything else -> web (SvelteKit).
# SPDX-License-Identifier: AGPL-3.0-or-later

upstream ophq_web { server web:3000; }
upstream ophq_control { server control-plane:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    location /api/ {
        proxy_pass http://ophq_control;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ophq_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

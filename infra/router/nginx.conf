# OpenPrintHQ edge router — single entrypoint for the app CT.
# npmplus proxies internal.example.com -> this router on :80.
# /api/* -> control-plane ; everything else -> web (SvelteKit).
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Uses the Docker embedded DNS resolver + variable proxy_pass so upstream IPs
# are re-resolved at request time — a control-plane/web container recreate (new
# IP) no longer strands nginx on a stale IP (which caused 502s).

server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $ophq_control http://control-plane:8080;
        proxy_pass $ophq_control;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $ophq_web http://web:3000;
        proxy_pass $ophq_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

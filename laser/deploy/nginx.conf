# OpenPrintHQ Laser: a static page served at /apps/laser/, the path the hub's proxy sends here whole.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;

  # files are converted in the browser only; nothing is ever posted here
  client_max_body_size 1k;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  # The hub asks this to tell whether the laser tools are installed (the hub's docs/crafts.md).
  location = /apps/laser/healthz { access_log off; default_type application/json; return 200 '{"ok":true,"app":"openprinthq-laser"}'; }
  location = /apps/laser { return 308 /apps/laser/; }
  location /apps/laser/ {
    try_files $uri $uri/ =404;
    location ~* \.(js|css|json)$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  }
  location / { return 404; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

name: ci

# Tests, secret scan and provenance check for every pull request and every push to main: the hub, the farm
# (farm/), OpenPrintHQ Laser (laser/) and the shared look (ui/).
# GitHub-hosted runners only. Never point this repository at a self-hosted runner: a pull request from a fork
# would run its code there.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same base as the image, so the system libraries match what ships.
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends libxml2 libxslt1.1
          pip install --no-cache-dir -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  screens:
    # Every route of a throwaway hub (SQLite, development sign-in) at 1920 x 1080 and 1280 x 860: the page never
    # scrolls and nothing is cut off. The screenshots are kept with the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Start a throwaway hub
        env:
          HUB_DATA_DIR: /tmp/hub/data
          HUB_LIBRARY_ROOT: /tmp/hub/lib
          HUB_SOURCE_ROOT: /tmp/hub
          HUB_DATABASE_URL: sqlite:////tmp/hub/hub.db
          HUB_DEV_AUTH_BYPASS: "true"
          HUB_SESSION_SECRET: ci-only-session-secret-ci-only
        run: |
          mkdir -p /tmp/hub/data /tmp/hub/lib
          ln -s ../frontend/build backend/static
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8080 > /tmp/hub/hub.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8080/api/v1/ingest -F 'meta={"name":"Gear housing","category":"Mechanical"}' >/dev/null
      - name: Screens
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8080
          SHOTS_DIR: test-results/screens
        run: npx playwright test
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: screens
          path: frontend/test-results/screens
          retention-days: 14
      - name: Hub log
        if: failure()
        run: tail -n 100 /tmp/hub/hub.log

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Build and test the shared look
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test

  farm-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install
        working-directory: farm/web
        run: npm ci --no-audit --no-fund
      - name: Build (at the site root)
        working-directory: farm/web
        run: npm run build
      - name: Build under /apps/farm, as the hub serves it
        working-directory: farm/web
        env:
          BASE_PATH: /apps/farm
        run: npm run build

  farm-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      # No package-lock.json committed, so npm ci is not usable here.
      - name: Install
        working-directory: farm/control-plane
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: farm/control-plane
        run: |
          set -euo pipefail
          find src -name '*.js' -o -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          node --check src/server.js
      # The signing parity suite checks the control plane against the connector agent that shipped, in its own
      # (archived) repository.
      - name: Fetch the shipped connector agent
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/norjms/openprinthq-cloud-client/main/agent/src/agent.js \
            -o "$RUNNER_TEMP/agent.js"
      - name: Tests
        working-directory: farm/control-plane
        env:
          OPHQ_AGENT_SRC: ${{ runner.temp }}/agent.js
        run: npm test

  farm-orcaslicer-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: farm/control-plane/orcaslicer-addon
        run: python3 -I -m unittest discover -s tests

  farm-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: farm/web/Dockerfile
          - name: control-plane
            context: farm/control-plane
            file: farm/control-plane/Dockerfile
          - name: router
            context: farm/infra/router
            file: farm/infra/router/Dockerfile
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: openprinthq-farm-${{ matrix.name }}:ci
          cache-from: type=gha,scope=farm-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=farm-${{ matrix.name }}

  laser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Round trips, and the page
        working-directory: laser
        run: |
          npm ci --no-audit --no-fund
          npm test
          sh tools/build.sh
      - name: Image, served under /apps/laser
        run: |
          docker build -t openprinthq-laser:ci laser
          docker run -d --name laser -p 8080:80 openprinthq-laser:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/apps/laser/ | grep -q 'Convert files'
          curl -fs http://127.0.0.1:8080/apps/laser/healthz | grep -q '"app":"openprinthq-laser"'
          curl -fs -o /dev/null http://127.0.0.1:8080/apps/laser/vendor/openprinthq-ui/icons.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 404
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/apps/laser)" = "http://127.0.0.1:8080/apps/laser/"

  # A hub image built from the repository root, with ui/ beside the frontend.
  hub-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: openprinthq:ci
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Scan the tree
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo --redact --no-banner
      - name: Scan the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git config --global --add safe.directory "$PWD"
          # A push that rewrote history has a "before" commit that is no longer in it: check everything then.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            opts="$HEAD_SHA"
          else
            opts="$BASE..$HEAD_SHA"
          fi
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --log-opts="$opts"

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Test the checker
        run: |
          pip install pytest
          git config --global user.name ci
          git config --global user.email ci@example.com
          python -m pytest -q -p no:cacheprovider tools/tests
      - name: Check tracked files and the new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that rewrote history has a "before" commit that is no longer in it: check everything then.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python tools/check_provenance.py --range "$HEAD_SHA"
          else
            python tools/check_provenance.py --range "$BASE..$HEAD_SHA"
          fi

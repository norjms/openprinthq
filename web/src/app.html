<!doctype html>
<html lang="en" data-theme="glass-dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" id="ophq-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172028" />
    <meta name="description" content="OpenPrintHQ: one command center for every 3D printer. Bambu Lab, Creality, Prusa, Snapmaker and Voron in one private, self-hostable HQ. Open source, AGPL-3.0." />
    <meta property="og:title" content="OpenPrintHQ: one HQ for every printer" />
    <meta property="og:description" content="Multi-brand 3D print farm management. Your printers, your data, your rules." />
    <meta property="og:type" content="website" />
    <script>
      /* No-flash appearance bootstrap. Reads the `ophq_appearance` cookie (a small
         JSON cache of the user's saved appearance) and applies transparency, text
         scale and accessibility attributes to <html> before the first paint. The
         theme is always glass-dark. The app re-applies from the server on load and
         refreshes this cookie. Fails safe to the defaults. */
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)ophq_appearance=([^;]+)/);
          if (!m) return;
          var cfg = JSON.parse(decodeURIComponent(m[1]));
          var el = document.documentElement;
          if (cfg.transparency === 'on' || cfg.transparency === 'off') el.setAttribute('data-transparency', cfg.transparency);
          if (cfg.textScale) el.style.setProperty('--ophq-text-scale', cfg.textScale);
          var a = cfg.a11y || {};
          if (a.underline) el.setAttribute('data-a11y-underline', 'on');
          if (a.focus) el.setAttribute('data-a11y-focus', 'strong');
          if (a.targets) el.setAttribute('data-a11y-targets', 'large');
          if (a.font) el.setAttribute('data-a11y-font', 'legible');
          if (a.motion) el.setAttribute('data-a11y-motion', 'reduce');
          if (cfg.favicon) {
            var f = document.getElementById('ophq-favicon');
            if (f) { f.setAttribute('href', cfg.favicon); f.removeAttribute('type'); }
          }
        } catch (e) { /* fail safe: keep the defaults */ }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
